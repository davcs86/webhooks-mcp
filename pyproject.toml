[project]
name = "webhooks-mcp"
version = "0.1.0"
description = "Stores webhooks POSTed to it and serves them to AI agents over MCP"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3,<3",
    "starlette",
    "uvicorn",
]

[project.scripts]
webhooks-mcp = "webhooks_mcp.main:cli"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webhooks_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
