name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install uv==0.11.32
      - run: uv sync --extra dev --frozen
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -W error

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: docker build -t webhooks-mcp:ci .
      - run: scripts/smoke.sh webhooks-mcp:ci
      - name: Push to GHCR and print the digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          ref="ghcr.io/davcs86/webhooks-mcp:${GITHUB_SHA}"
          docker tag webhooks-mcp:ci "$ref"
          docker push "$ref"
          sha="$(docker inspect --format '{{index .RepoDigests 0}}' "$ref")"
          digest="ghcr.io/davcs86/webhooks-mcp@${sha##*@}"
          echo "$digest"
          echo "$digest" >> "$GITHUB_STEP_SUMMARY"
